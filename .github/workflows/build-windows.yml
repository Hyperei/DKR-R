name: Windows host tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned runtime dependencies
        uses: ./.github/actions/prepare-dependencies # zizmor: ignore[self-repository] -- actionlint 1.7.12 compatibility; checkout uses this workflow revision.
      - name: Configure
        working-directory: runtime-recomp
        run: cmake --preset host-windows
      - name: Build
        working-directory: runtime-recomp
        run: cmake --build --preset host-windows --parallel
      - name: Test
        working-directory: runtime-recomp
        run: ctest --preset host-windows --parallel 2 --output-junit ../build/host-windows/junit.xml
      - name: Capture regression and benchmark report
        run: python scripts/regression.py --build-dir build/host-windows --repeat 1 --warmup 0 --output build/regression/ci
      - name: Preserve regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-windows
          retention-days: 7
          if-no-files-found: ignore
          path: build/regression/ci/
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows
          retention-days: 7
          if-no-files-found: ignore
          path: build/host-windows/junit.xml
      - name: Preserve failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-windows
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/host-windows/CMakeFiles/CMakeConfigureLog.yaml
            build/host-windows/CMakeFiles/CMakeError.log
            build/host-windows/CMakeFiles/CMakeOutput.log
            build/host-windows/Testing/Temporary/LastTest.log
            build/host-windows/Testing/Temporary/LastTestsFailed.log
