name: windows policy tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned runtime dependencies
        run: python scripts/bootstrap_dependencies.py --only n64-modern-runtime --only rt64 --only gekkonet --only monocypher --only libdatachannel --only mbedtls --only sdl3
      - name: Apply reviewed patches
        run: python scripts/apply_dependency_patches.py
      - name: Configure
        working-directory: runtime-recomp
        run: cmake --preset policy-windows
      - name: Build
        working-directory: runtime-recomp
        run: cmake --build --preset policy-windows --parallel
      - name: Test
        working-directory: runtime-recomp
        run: ctest --preset policy-windows --output-junit ../build/policy-windows/junit.xml
      - name: Capture regression and benchmark report
        run: python scripts/regression.py --build-dir build/policy-windows --repeat 1 --warmup 0 --output build/regression/ci
      - name: Preserve regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-windows
          retention-days: 7
          if-no-files-found: ignore
          path: build/regression/ci/
      - name: Preserve failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-windows
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/policy-windows/CMakeFiles/CMakeConfigureLog.yaml
            build/policy-windows/CMakeFiles/CMakeError.log
            build/policy-windows/CMakeFiles/CMakeOutput.log
            build/policy-windows/Testing/Temporary/LastTest.log
            build/policy-windows/Testing/Temporary/LastTestsFailed.log
            build/policy-windows/junit.xml
